# Déploiement de Bam'S Market sur Render (Blueprint).
# Ce fichier ne contient AUCUN secret : les variables marquées "sync: false" sont à saisir
# à la main dans le tableau de bord Render, à la création du Blueprint.

databases:
  - name: bams-market-db
    plan: basic-256mb        # payant : sauvegardes incluses (le plan gratuit est supprimé après 30 jours)
    region: frankfurt
    databaseName: bams_market

services:
  # ───────────── API (NestJS) ─────────────
  - type: web
    name: bams-market-api
    runtime: node
    plan: starter            # payant : toujours actif, indispensable pour recevoir le webhook GoalPay
    region: frankfurt
    rootDir: backend
    # --include=dev : le build a besoin de @nestjs/cli et de TypeScript, même avec NODE_ENV=production.
    # prisma generate : le dossier generated/prisma n'est pas dans git.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Les migrations sont appliquées à chaque démarrage, avant de lancer le serveur.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bams-market-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # longue valeur aléatoire créée par Render
      - key: PAYMENT_MODE
        value: goalpay       # paiement réel
      - key: PAYOUT_MODE
        value: simulation    # retraits réels repoussés après la soutenance
      - key: TRUST_PROXY
        value: "1"           # à ajuster après le premier déploiement (voir la limite de débit)
      - key: CORS_ORIGIN
        sync: false          # adresse du site (frontend), sans barre finale
      - key: FRONTEND_URL
        sync: false          # même adresse : utilisée dans les liens des e-mails
      - key: GOALPAY_ACCESS_KEY
        sync: false
      - key: GOALPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ───────────── Site (Next.js) ─────────────
  - type: web
    name: bams-market-web
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    # Render impose son propre port ($PORT) : on ne passe pas par "npm run start" (port 3001 fixe).
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # Les variables NEXT_PUBLIC_* sont figées au moment du build : toute modification demande un redéploiement.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
