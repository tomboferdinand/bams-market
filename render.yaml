# Déploiement de l'API Bam'S Market sur Render (Blueprint) — budget zéro.
#   - API       : Render, plan gratuit (ce fichier)
#   - Base      : Neon (PostgreSQL gratuit, Francfort)   -> DATABASE_URL
#   - Site      : Vercel (dossier frontend/, avec BACKEND_URL)
#   - E-mails   : Brevo en SMTP, port 2525 (Render gratuit bloque 25, 465 et 587)
# Ce fichier ne contient AUCUN secret : les variables marquées "sync: false" sont à saisir
# à la main dans le tableau de bord Render, à la création du Blueprint.

services:
  - type: web
    name: bams-market-api
    runtime: node
    plan: free               # s'endort après 15 min sans visite : prévoir un ping de /health (UptimeRobot)
    region: frankfurt        # même région que la base Neon
    rootDir: backend
    # --include=dev : le build a besoin de @nestjs/cli et de TypeScript, même avec NODE_ENV=production.
    # prisma generate : le dossier generated/prisma n'est pas dans git.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Les migrations sont appliquées à chaque démarrage, avant de lancer le serveur.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      # Adresse DIRECTE de Neon (hôte sans "-pooler"), avec sslmode=verify-full :
      # prisma migrate deploy ne fonctionne pas à travers le pooler.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true  # longue valeur aléatoire créée par Render
      # Premier déploiement : tout en simulation. Passer à "goalpay" dans le tableau de bord Render
      # une fois le site vérifié (PAYMENT_MODE d'abord, PAYOUT_MODE quand le retrait réel sera prêt).
      - key: PAYMENT_MODE
        value: simulation
      - key: PAYOUT_MODE
        value: simulation
      - key: TRUST_PROXY
        value: "1"           # à ajuster après le premier déploiement (voir la limite de débit)
      # Balayage des commandes impayées toutes les 30 min au lieu de 60 s : une requête par minute
      # empêcherait la base Neon de se mettre en veille et épuiserait son quota gratuit.
      - key: EXPIRY_SWEEP_SECONDS
        value: "1800"
      - key: CORS_ORIGIN
        sync: false          # adresse du site Vercel, sans barre finale
      - key: FRONTEND_URL
        sync: false          # même adresse : utilisée dans les liens des e-mails
      - key: GOALPAY_ACCESS_KEY
        sync: false
      - key: GOALPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"        # connexion chiffrée par STARTTLS
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false          # expéditeur validé dans Brevo
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
